        <style>
            h1 {
                font-family:'Courier New', Courier, monospace;
                background-color: darkslategray;
                color: lightsteelblue;
                padding: 10px 20px;
                margin: 0;
                text-align: center;
            }
            .legend {
                padding: 6px 8px;
                line-height: 18px;
                background: rgba(255,255,255,0.9);
                box-shadow: 0 0 15px rgba(0,0,0,0.2);
                border-radius: 5px;
            }
            .legend i {
                width: 18px;
                height: 18px;
                float: left;
                margin-right: 8px;
                opacity: 0.7;
            }
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
            #map {
                position: relative;          /* Keeps absolute elements like the legend trapped inside the map */
                height: calc(100vh - 51px);  /* Forces map to take up exactly the remaining window height minus the h1 header */
                width: 100%;                 /* Spans the full screen width */
            }
        </style>

    </head>

    <body>
        <h1>London Population and Light Density</h1>
        <div id="map"></div>

        <script type="text/javascript">

            var map = L.map('map', {
                center: [51.48,-0.07],
                zoom: 10
            });
            var darkCanvas = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles © Esri — Esri, DeLorme, NAVTEQ',
                maxZoom: 11,
                minZoom: 5
            }).addTo(map);
            var terrain = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                maxZoom: 17,
	            attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
            });
            var boroughs = L.geoJson(data, {style:style}).addTo(map);
            var nasaCityLights = L.tileLayer.wms('https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi?', {
                layers: 'VIIRS_CityLights_2012',
                format: 'image/png',
                transparent: true,
                opacity: 0.6,
                attribution: 'Imagery courtesy of NASA EOSDIS GIBS'
            }).addTo(map);
            var basemaps = {
                "Dark Gray Canvas": darkCanvas,
                "Terrain": terrain
            };
            var overlaymaps = {
                "London Boroughs": boroughs,
                "NASA City Lights": nasaCityLights
            };
            var legend = L.control({position: 'bottomright'});


            function getColor(value) {
                return value > 139 ? '#253494':
                    value > 87  ? '#2c7fb8':
                    value > 53  ? '#41b6c4':
                    value > 32  ? '#a1dab4':
                                  '#ffffcc';
            }

            function style(feature){
                return {
                    fillColor: getColor(feature.properties.pop_den),
                    weight: 2,
                    opacity: 1,
                    color: 'gray',
                    fillOpacity: 0.9
                };
            }

            L.control.layers(basemaps, overlaymaps).addTo(map);

            map.on('overlayremove', function(eventLayer){
            if (eventLayer.name == 'London Boroughs'){ 
                map.removeControl(legend);
            }
            });

            map.on('overlayadd', function(eventLayer){
            if (eventLayer.name == 'London Boroughs'){
                legend.addTo(map);
            }
            });
            
            legend.onAdd = function (map) {

                var div = L.DomUtil.create('div', 'legend'),
                    grades = [0, 32, 53, 87, 139]; 

                div.innerHTML = '<b>Population Density <br> 2011 <br></b>';

                for (var i = 0; i < grades.length; i++) {
                    div.innerHTML +=
                    '<i style="background:' + getColor(grades[i] + 1) + '"></i>' +
                    grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+');
                }

                return div;
            };

            legend.addTo(map);

        </script>
   </body>
</html>
